# Render Blueprint for the Shadowline API (backend/). See DEPLOY.md.
# Render: New -> Blueprint -> pick this repo. The frontend deploys separately on Vercel.
services:
  - type: web
    name: shadowline-api
    runtime: python
    plan: free
    rootDir: backend
    # Kernels are downloaded at BUILD time so they're baked into the deploy (never fetched at startup).
    buildCommand: pip install -r requirements.txt && python scripts/fetch_kernels.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      # Your Vercel production URL, no trailing slash (comma-separate several). Set after the first Vercel deploy.
      - key: ALLOWED_ORIGINS
        value: https://your-app.vercel.app
      # Lets Vercel preview deployments call the API too. Remove it to allow production only.
      - key: ALLOWED_ORIGIN_REGEX
        value: https://.*\.vercel\.app
